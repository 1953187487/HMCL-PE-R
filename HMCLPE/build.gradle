plugins {
    id 'com.android.application'
}

android {
    compileSdk 34
    dexOptions {
        javaMaxHeapSize "4g"
    }
	
    lintOptions {
        abortOnError false
    }
	
    signingConfigs {
        // NOTE: The release signing key from upstream (HMCL-PE by Tungstend)
        // is intentionally NOT reused. Build a fresh one via
        //   keytool -genkeypair -v -keystore release.jks -alias renewed \
        //         -keyalg RSA -keysize 2048 -validity 10000
        // and drop it under HMCLPE/release.jks before shipping.
        release {
            storeFile file("release.jks")
            storePassword System.getenv("HMCLR_KEYSTORE_PASS") ?: "dev-change-me"
            keyAlias System.getenv("HMCLR_KEY_ALIAS") ?: "renewed"
            keyPassword System.getenv("HMCLR_KEY_PASS") ?: "dev-change-me"
        }
    }
    
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
     
    defaultConfig {
        applicationId "com.hmclpe.renewed"
        minSdk 26
        targetSdk 34
        versionCode 10012

        versionName "1.0.8"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        pickFirst 'META-INF/LICENSE.md' // picks the JavaMail license file
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/NOTICE.md'
        exclude 'META-INF/notice.txt'
        exclude 'META-INF/ASL2.0'
        exclude("META-INF/*.kotlin_module")
    }

}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(path: ':FilePicker')
    implementation project(path: ':ZipTools')
    implementation project(path: ':Boat')
    implementation project(path: ':PojavLauncher')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.9.3'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'cat.ereza:customactivityoncrash:2.3.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.moandjiezana.toml:toml4j:0.7.2'
    implementation 'org.apache.commons:commons-compress:1.21'
    implementation 'com.jaredrummler:colorpicker:1.1.0'
    implementation 'com.jaredrummler:android-device-names:2.1.0'
    implementation 'org.jsoup:jsoup:1.14.3'
    implementation 'org.apache.commons:commons-lang3:3.13.0'
    implementation 'org.jenkins-ci:constant-pool-scanner:1.2'
    // com.github.steveice10:opennbt、com.github.gzu-liyujiang:Android_CN_OAID、
    // com.github.nedimf:maildroid、com.github.naman14:app-theme-engine 均托管在
    // JitPack / JCenter, 这两个仓库已不再允许匿名下载, 依赖已改为仓库内置实现。
    //
    // Hin2n 是独立的 VPN Android App (https://github.com/switch-iot/hin2n),
    // 不是可导入的 Java 库。本二改通过 Intent 引导用户去 Hin2n App 建立虚拟网络隧道,
    // 让多台 Android 设备上的 Minecraft Java 版能跨公网直连联机 (类似 n2n 虚拟局域网)。
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
