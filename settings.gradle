dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        // Local mirror for artifacts that cannot be downloaded reliably from Maven Central
        // on restricted networks. Populate it by placing artifacts in Maven layout.
        maven { url 'file:///opt/maven-local' }
        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }
}
rootProject.name = "HMCL-PE-Renewed"
include ':HMCLPE'
include ':FilePicker'
include ':Boat'
include ':PojavLauncher'
include ':ZipTools'
